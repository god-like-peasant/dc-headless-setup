name: Windows Kit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: PowerShell syntax and safety invariants
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate scripts and repository contract
        shell: pwsh
        run: ./tests/Test-Kit.ps1
